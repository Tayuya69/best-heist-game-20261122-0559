<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDNIGHT VAULT — The Star Sapphire Job</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0d12;
    color: #e8e4d8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 4px;
    color: #f2c14e;
  }
  h1 span { color: #4fd2ff; }
  canvas {
    display: block;
    width: min(960px, 96vw);
    height: auto;
    background: #0b0d12;
    border: 2px solid #3a3f4d;
    border-radius: 6px;
    cursor: crosshair;
  }
  p.help {
    margin: 0;
    font-size: 13px;
    color: #9aa1b0;
    text-align: center;
    max-width: 960px;
  }
</style>
</head>
<body>
<h1>MIDNIGHT VAULT <span>— The Star Sapphire Job</span></h1>
<canvas id="game" width="960" height="600"></canvas>
<p class="help">Slip past the guards and cameras, crack the sapphire case, and walk out the green EXIT.
WASD / arrows move, Shift sneaks, click walks there, M mutes, P pauses, R retries.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
